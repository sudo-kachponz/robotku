# nginx config — robotku static export on a 1GB VPS, tuned for ~300 concurrent users.
#
# Robotku is a static Next.js export (`output: 'export'`). The server does NO
# per-user compute: it only sends files. So RAM/CPU are a non-issue on 1GB —
# the real levers are compression, caching, and bandwidth. This config maxes
# those out. Place site files at /var/www/robotku (contents of the `out/` dir).
#
# Install:
#   sudo cp deploy/nginx-robotku.conf /etc/nginx/sites-available/robotku
#   sudo ln -s /etc/nginx/sites-available/robotku /etc/nginx/sites-enabled/
#   sudo rsync -a --delete out/ /var/www/robotku/
#   sudo certbot --nginx -d hub.robotku.id     # HTTPS is REQUIRED (Web Serial/BLE/getUserMedia)
#   sudo nginx -t && sudo systemctl reload nginx
#
# The `events`/`worker` tuning below lives in http/main scope. If you paste this
# as a site file, keep only the `server {}` blocks and move the two lines marked
# [MAIN] into /etc/nginx/nginx.conf. On a fresh Ubuntu box the defaults already
# cover 300 concurrent; the [MAIN] lines just raise headroom.

# [MAIN] worker_processes auto;                 # one worker per core
# [MAIN] events { worker_connections 4096; }    # 300 users * a few conns each, with room

# --- rate limiting: cheap abuse guard, not a WAF. 300 legit users are fine. ---
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_zone  $binary_remote_addr zone=reqs:10m rate=50r/s;

# --- HTTP -> HTTPS. Secure context is mandatory for the robot connect features. ---
server {
    listen 80;
    listen [::]:80;
    server_name hub.robotku.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.robotku.id;

    root /var/www/robotku;
    index index.html;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/hub.robotku.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hub.robotku.id/privkey.pem;

    # --- serving perf ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # fewer stat() syscalls per request when many users hit the same files
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- compression: biggest win for a JS-heavy static app ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm text/xml application/xml font/ttf font/otf;
    # If you build the brotli module (or use nginx from a distro that ships it),
    # uncomment for ~15-20% smaller JS than gzip:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml application/wasm;

    # --- basic abuse guard ---
    limit_conn perip 40;                 # one IP can't hog all connections
    limit_req  zone=reqs burst=100 nodelay;

    # --- hashed build assets: immutable, cache forever ---
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- 3D sim assets (20MB): long cache; only fetched when a user opens the 3D sim ---
    location /sim3d/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- static media ---
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|webp|svg|ico|wasm|bin|glb|gltf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- deploy freshness: HTML + version.json must always re-check ---
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- routing for a trailingSlash static export: /foo/ -> /foo/index.html ---
    location / {
        add_header Cache-Control "no-cache, must-revalidate";  # HTML picks up new deploys immediately
        try_files $uri $uri/ $uri/index.html /404/index.html;
    }

    error_page 404 /404/index.html;

    # no directory listings, no dotfiles
    autoindex off;
    location ~ /\.(?!well-known) { deny all; }
}
