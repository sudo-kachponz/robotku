# deploy/nginx-fira-proxy.conf
#
# Rutekan /api/fira/ ke proxy Fira (server/fira-proxy.mjs) — same-origin, tanpa CORS.
# Tempel blok location ini KE DALAM server{} situs Robotku yang sudah ada.
# App memanggil "/api/fira/chat" (default brain.ts), nginx meneruskan ke proxy lokal.
#
# Jalankan proxy sebagai service (systemd) dengan kunci di env, mis:
#   Environment=NETRA_API_KEY=sk_...        (JANGAN commit; pakai secret manager)
#   ExecStart=/usr/bin/node /path/robotku/server/fira-proxy.mjs
#   Environment=PORT=8787 FIRA_ALLOW_ORIGIN=https://APPMU
#
# SSE butuh buffering OFF supaya token mengalir real-time.

location /api/fira/ {
    proxy_pass         http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $remote_addr;

    # streaming (Server-Sent Events)
    proxy_set_header   Connection '';
    proxy_buffering    off;
    proxy_cache        off;
    chunked_transfer_encoding on;
    proxy_read_timeout 120s;
}
