; ============================================================================
; PlatformIO project for the Robotku ESP32 firmware — ONE firmware, TWO variants.
;   pio run -e v3         -> ESP32_Controller_V3 (discrete RGB, buzzer, no I2S)
;   pio run -e makerkit   -> Makerkit V1.2 (WS2812B + I2S mic/speaker, new pins)
; Bare `pio run` / upload targets v3 (default_envs). Versions are the exact ones
; this firmware was compiled against (Arduino ESP32 core 2.0.17) — see README
; before bumping any of them. The board difference is expressed ONLY through the
; BOARD_* build flag -> pins_*.h; main.cpp has no #ifdef BOARD_*.
; ============================================================================
[platformio]
default_envs = v3

[env]
platform = espressif32@6.9.0     ; -> Arduino ESP32 core 2.0.17
board = esp32dev
framework = arduino

monitor_speed = 115200
; 115200 matches the RoboSchool-Controller setup and any USB-UART bridge/cable.
; Raise to 921600 only once a faster upload is proven on your board — a cable or
; board that cannot hold 921600 fails with a confusing "packet content transfer
; stopped" error rather than an obvious speed complaint.
upload_speed = 115200

lib_deps =
    ; Pin NimBLE to 1.4.x. 2.x renames the onMTUChange callback signature and
    ; will break this build without an obvious error.
    h2zero/NimBLE-Arduino @ 1.4.3
    ; ArduinoJson 7 — StaticJsonDocument is deprecated; this code uses JsonDocument.
    bblanchon/ArduinoJson @ ^7.4.3
    madhephaestus/ESP32Servo @ ^3.2.1
    adafruit/Adafruit SSD1306 @ ^2.5.17
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit BusIO @ ^1.17.4
    ; WS2812B on the Makerkit variant (RMT-driven, not LEDC). Installed for both
    ; envs; only linked when main.cpp #includes it under HAS_NEOPIXEL.
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; I2S mic/speaker use driver/i2s.h from the ESP-IDF bundled in the core — no lib.

[env:v3]
build_flags = -D BOARD_V3

[env:makerkit]
build_flags = -D BOARD_MAKERKIT

; --- Arduino IDE users (no PlatformIO) ---
; Install the same libraries from Library Manager at the versions above, select
; an "ESP32 Dev Module" board on ESP32 core 2.0.x, and open robotku-esp32.ino (the
; code is compiled from src/). Without a BOARD_* flag config.h defaults to V3.
