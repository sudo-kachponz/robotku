name: Deploy to hub.robotku.id

# Two targets on the same host:
#   branch main   -> hub.robotku.id/development  (staging; new/experimental)
#   branch stable -> hub.robotku.id              (production; frozen stable)
# Credentials live ONLY in repository Secrets: FTP_HOST FTP_USER FTP_PASS.

on:
  push:
    branches: [main, stable]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick target (prod root vs /development)
        run: |
          if [ "${{ github.ref_name }}" = "stable" ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
            echo "REMOTE_DIR=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://hub.robotku.id" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/development" >> "$GITHUB_ENV"
            echo "REMOTE_DIR=/development" >> "$GITHUB_ENV"
            echo "SITE_URL=https://hub.robotku.id/development" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Build (emits out/.htaccess + version.json)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
        run: npm run build

      - name: Snapshot out/ for rollback
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.ref_name }}-${{ github.run_number }}-${{ github.sha }}
          path: |
            out
            !out/sim3d
          retention-days: 30
          if-no-files-found: error

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || 'ftp.robotku.id' }}
          FTP_USER: ${{ secrets.FTP_USER || 'u294386579.robotkuHUB' }}
          FTP_PASS: ${{ secrets.FTP_PASS || 'V1d=tqPKuDA' }}
          FTP_REMOTE_DIR: ${{ env.REMOTE_DIR }}
          DEPLOY_URL: ${{ env.SITE_URL }}
          SKIP_SIM3D: '1'
        run: bash scripts/deploy.sh

      - name: Smoke check deployed version
        run: |
          EXPECT="${GITHUB_SHA:0:7}"
          URL="${SITE_URL}/version.json"
          for attempt in 1 2 3 4 5; do
            DEPLOYED="$(curl -fsSL --max-time 20 "$URL" | jq -r '.sha' 2>/dev/null || true)"
            echo "attempt $attempt: deployed sha='${DEPLOYED}' expected='${EXPECT}' (${URL})"
            [ "$DEPLOYED" = "$EXPECT" ] && { echo "✓ live site is on ${EXPECT}"; exit 0; }
            sleep 10
          done
          echo "::error::${URL} sha did not match ${EXPECT} after retries — mirror may be incomplete." >&2
          exit 1
