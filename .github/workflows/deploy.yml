name: Deploy to hub.robotku.id

# Static export → FTPS mirror. Credentials live ONLY in repository Secrets:
#   FTP_HOST  FTP_USER  FTP_PASS   (rotate on every leak; never commit them)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (emits out/.htaccess + version.json)
        run: npm run build

      # Rollback snapshot: keep the exact out/ we're about to deploy as a dated
      # artifact. To roll back, download it and re-mirror with scripts/deploy.sh.
      # sim3d (26 MB, rarely changes, uploaded separately) is excluded to stay small.
      - name: Snapshot out/ for rollback
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ github.run_number }}-${{ github.sha }}
          path: |
            out
            !out/sim3d
          retention-days: 30
          if-no-files-found: error

      # Safety: never deploy with missing/old credentials. Fails loudly if the
      # Secrets have not been set (rotate the leaked FTP creds first).
      - name: Verify FTP secrets are present
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::FTP_HOST/FTP_USER/FTP_PASS secrets are not set. Rotate the leaked credentials and add them to repository Secrets before deploying." >&2
            exit 1
          fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          SKIP_SIM3D: '1' # launch payload excludes the 26 MB of 3D assets
        run: bash scripts/deploy.sh

      # A half-finished FTPS mirror can exit 0 while the live site is stale. Fetch
      # the just-deployed version.json (htaccess serves it no-cache) and confirm its
      # sha matches this commit before declaring the deploy healthy.
      - name: Smoke check deployed version
        run: |
          EXPECT="${GITHUB_SHA:0:7}"
          URL="https://hub.robotku.id/version.json"
          for attempt in 1 2 3 4 5; do
            DEPLOYED="$(curl -fsSL --max-time 20 "$URL" | jq -r '.sha' 2>/dev/null || true)"
            echo "attempt $attempt: deployed sha='${DEPLOYED}' expected='${EXPECT}'"
            [ "$DEPLOYED" = "$EXPECT" ] && { echo "✓ live site is on ${EXPECT}"; exit 0; }
            sleep 10
          done
          echo "::error::Deployed version.json sha did not match ${EXPECT} after retries — the mirror may be incomplete. Investigate before trusting this deploy." >&2
          exit 1
