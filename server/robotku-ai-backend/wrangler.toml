name = "robotku-ai"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Workers AI binding — powers POST /tts (MeloTTS text-to-speech) so the robot can
# speak the AI reply. No extra API key; billed to this Cloudflare account.
[ai]
binding = "AI"

# Allowed browser origin for CORS. Change if you test from another host.
[vars]
FIRA_ALLOW_ORIGIN = "https://hub.robotku.id"

# NETRA_API_KEY is a SECRET — never put it here. Set it with:
#   npx wrangler secret put NETRA_API_KEY
