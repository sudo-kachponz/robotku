name = "robotku-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGINS = "https://hub.robotku.id,http://localhost:3000,http://localhost:8080"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "RelayRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
